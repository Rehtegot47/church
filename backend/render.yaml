# Render Blueprint — Grace Ville API (free tier)
# Render dashboard → New → Blueprint → select this repo → set the env vars below.
services:
  - type: web
    name: grace-ville-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false # TiDB host, e.g. xxx.tidbcloud.com
      - key: DB_PORT
        value: 4000
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: test
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: rccggva@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
